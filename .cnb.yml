# CNB CI/CD for CSV Splitter.
# Hosted CNB runners use Linux Docker containers. The backup GitHub repository
# builds the Windows and macOS packages on native runners, then CNB imports the
# assets for the same tag before creating the authoritative CNB release.

main:
  # Run the test suite for every pull request targeting main.
  pull_request:
    - name: Test pull request
      docker:
        image: python:3.11-slim-bookworm
        # Reuse pip's download cache between runs without sharing the source tree.
        volumes:
          - /root/.cache/pip
      stages:
        - name: Install test dependencies
          script: |
            set -eu
            python -m pip install --disable-pip-version-check --upgrade pip
            python -m pip install --disable-pip-version-check -r requirements.txt
            python -m pip install --disable-pip-version-check pytest
        - name: Run tests
          script: python -m pytest -q

  # Verify main pushes and build the Linux executable as a packaging check.
  push:
    - name: Verify main
      docker:
        image: python:3.11-slim-bookworm
        volumes:
          - /root/.cache/pip
      stages:
        - name: Install Linux packaging tools
          script: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            # PyInstaller needs objdump, and bundled Qt needs these runtime
            # libraries when the Linux executable starts in a slim container.
            apt-get update
            apt-get install -y --no-install-recommends \
              binutils \
              zip \
              libegl1 \
              libgl1 \
              libopengl0 \
              libglib2.0-0 \
              libx11-6 \
              libdbus-1-3 \
              libgssapi-krb5-2 \
              libxkbcommon0 \
              libfontconfig1 \
              libfreetype6 \
              libbrotli1
            rm -rf /var/lib/apt/lists/*
        - name: Install build dependencies
          script: |
            set -eu
            python -m pip install --disable-pip-version-check --upgrade pip
            python -m pip install --disable-pip-version-check -r requirements.txt
            python -m pip install --disable-pip-version-check pyinstaller pytest
        - name: Run tests
          script: python -m pytest -q
        - name: Build Linux executable
          script: |
            set -eu
            # The ZIP preserves the execute bit that direct CNB downloads lose.
            sh scripts/package_linux.sh
            mkdir -p dist_upload
            mv dist/CSV_Splitter_linux.zip dist_upload/CSV_Splitter_linux.zip

# A tag is the release boundary. Re-running a tag updates the same CNB release
# instead of deleting and recreating it, then replaces all three attachments.
$:
  tag_push:
    - name: Publish tagged release
      docker:
        image: python:3.11-slim-bookworm
        volumes:
          - /root/.cache/pip
      stages:
        - name: Install Linux packaging tools
          script: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            # Keep the tag build identical to the main packaging check.
            apt-get update
            apt-get install -y --no-install-recommends \
              binutils \
              curl \
              zip \
              libegl1 \
              libgl1 \
              libopengl0 \
              libglib2.0-0 \
              libx11-6 \
              libdbus-1-3 \
              libgssapi-krb5-2 \
              libxkbcommon0 \
              libfontconfig1 \
              libfreetype6 \
              libbrotli1
            rm -rf /var/lib/apt/lists/*
        - name: Install release dependencies
          script: |
            set -eu
            python -m pip install --disable-pip-version-check --upgrade pip
            python -m pip install --disable-pip-version-check -r requirements.txt
            python -m pip install --disable-pip-version-check pyinstaller pytest
        - name: Run tests
          script: python -m pytest -q
        - name: Build Linux executable
          script: |
            set -eu
            # The ZIP preserves the execute bit that direct CNB downloads lose.
            sh scripts/package_linux.sh
            mkdir -p dist_upload
            mv dist/CSV_Splitter_linux.zip dist_upload/CSV_Splitter_linux.zip
        - name: Fetch cross platform packages
          script: |
            set -eu
            # GitHub's native Windows and Apple Silicon jobs finish after this
            # CNB tag job starts. Retry public asset downloads until both jobs
            # have published the exact same tag, or fail instead of using stale
            # files from an older release.
            release_url="https://github.com/mobilEKG/CSV-Splitter/releases/download/${CNB_BRANCH}"
            fetch_asset() {
              asset_name="$1"
              asset_path="dist_upload/${asset_name}"
              attempt=1
              while [ "${attempt}" -le 40 ]; do
                if curl --fail --location --silent --show-error \
                  --output "${asset_path}" "${release_url}/${asset_name}"; then
                  test -s "${asset_path}"
                  return 0
                fi
                rm -f "${asset_path}"
                if [ "${attempt}" -lt 40 ]; then
                  sleep 15
                fi
                attempt=$((attempt + 1))
              done
              echo "Timed out waiting for GitHub asset: ${asset_name}" >&2
              exit 1
            }
            fetch_asset CSV_Splitter_macos.zip
            fetch_asset CSV_Splitter_windows.exe
        - name: Create CNB release
          type: git:release
          options:
            # Overlay mode makes tag retries idempotent.
            overlying: true
            title: "CSV Splitter ${CNB_BRANCH}"
            description: |
              CSV Splitter ${CNB_BRANCH} release.

              CNB builds the Linux executable for every tag. The GitHub backup
              builds the Windows executable and Finder-openable macOS ZIP on
              native runners, and CNB imports those exact tag assets.
            latest: true
        - name: Upload release assets
          # This is CNB's official release and commit attachment plugin.
          image: cnbcool/attachments:latest
          settings:
            attachments:
              # Use a relative glob so future tags upload only built files.
              - "./dist_upload/CSV_Splitter_*"
