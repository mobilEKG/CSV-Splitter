name: Build release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.2.6"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: >-
          python -m PyInstaller
          --clean --noupx --noconsole --noconfirm --onefile --windowed
          --icon=app_icon.ico
          --add-data "app_icon.ico;."
          --name CSV_Splitter_windows
          csv-splitter.py

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: CSV_Splitter_windows
          path: dist/CSV_Splitter_windows.exe
          if-no-files-found: error

  build-macos:
    # macos-14 is the native Apple Silicon runner used by this project.
    runs-on: macos-14
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build macOS package
        run: sh scripts/package_macos.sh

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: CSV_Splitter_macos
          path: dist/CSV_Splitter_macos.zip
          if-no-files-found: error

  publish-github-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: CSV_Splitter_windows
          path: release

      - name: Download macOS asset
        uses: actions/download-artifact@v4
        with:
          name: CSV_Splitter_macos
          path: release

      - name: Resolve release tag
        id: release
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub backup release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          tag="${{ steps.release.outputs.tag }}"
          title="CSV Splitter ${tag}"
          notes="CSV Splitter ${tag} release. CNB builds and publishes the Linux package; this GitHub backup workflow builds the Windows executable and Apple Silicon macOS ZIP on native runners."
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" release/CSV_Splitter_windows.exe release/CSV_Splitter_macos.zip \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${tag}" release/CSV_Splitter_windows.exe release/CSV_Splitter_macos.zip \
              --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes "${notes}" --latest
          fi
